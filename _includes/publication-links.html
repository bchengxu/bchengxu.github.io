<p class="publication-links">
  {% if include.paper.paperurl %}<a href="{{ include.paper.paperurl | relative_url }}"><i class="fas fa-file-pdf" aria-hidden="true"></i> PDF</a>{% endif %}
  {% if include.paper.doi %}<a href="https://doi.org/{{ include.paper.doi }}">DOI</a>{% endif %}
  {% if include.paper.codeurl %}<a href="{{ include.paper.codeurl }}"><i class="fas fa-code" aria-hidden="true"></i> Code</a>{% endif %}
  {% if include.paper.arxiv %}<a href="https://arxiv.org/abs/{{ include.paper.arxiv }}">arXiv</a>{% endif %}
</p>
